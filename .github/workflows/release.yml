name: Release (build + verify + publish)

on:
  push:
    branches:
      - main
      - staging
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Quality gates (lint, type-check, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install package + all dev dependencies
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check src/xtrace_sdk/ --output-format=github

      - name: Mypy
        run: uv run mypy src/xtrace_sdk/

      - name: Pytest (lookup encryption)
        run: uv run pytest tests/x_vec/test_paillier_lookup_encryption.py

      - name: Pytest (paillier encryption)
        run: uv run pytest tests/x_vec/test_paillier_encryption.py

  # ── Build matrix wheel: one cp3X wheel per supported Python ───────────
  # Builds the GPU .so inside an Ubuntu 20.04 CUDA container, then `uv build`
  # bundles it, and `auditwheel repair` retags as manylinux_2_31_x86_64 so
  # PyPI accepts it and pip can pick it up on glibc>=2.31 (Ubuntu 20.04+,
  # RHEL 8.4+, Debian 11+).
  build-wheel:
    name: Build wheel (py${{ matrix.python_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: qa
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.11"
            python_full_version: "3.11.15"
          - python_version: "3.12"
            python_full_version: "3.12.13"
          - python_version: "3.13"
            python_full_version: "3.13.13"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build GPU .so (Ubuntu 20.04 / glibc 2.31 baseline)
        env:
          PYTHON_VERSION: ${{ matrix.python_version }}
          PYTHON_FULL_VERSION: ${{ matrix.python_full_version }}
          PYTHON_STANDALONE_TAG: "20260414"
          CUDA_IMAGE: nvidia/cuda:12.4.1-devel-ubuntu20.04
        run: ./build_gpu_binaries.sh

      - name: Resolve version from git tag
        run: |
          if git describe --tags --exact-match HEAD 2>/dev/null; then
            VER=$(git describe --tags --exact-match HEAD)
            echo "SETUPTOOLS_SCM_PRETEND_VERSION=${VER#v}" >> "$GITHUB_ENV"
          fi

      - name: Build wheel
        run: uv build --wheel

      - name: Repair wheel (manylinux_2_31_x86_64)
        run: |
          uv pip install --system auditwheel patchelf
          mkdir -p wheelhouse
          auditwheel repair dist/*.whl --plat manylinux_2_31_x86_64 -w wheelhouse
          rm dist/*.whl
          mv wheelhouse/*.whl dist/
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-py${{ matrix.python_version }}
          path: dist/*.whl

  # ── Build sdist once (no Python ABI dependency) ───────────────────────
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: qa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Resolve version from git tag
        run: |
          if git describe --tags --exact-match HEAD 2>/dev/null; then
            VER=$(git describe --tags --exact-match HEAD)
            echo "SETUPTOOLS_SCM_PRETEND_VERSION=${VER#v}" >> "$GITHUB_ENV"
          fi

      - name: Build sdist
        run: uv build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  # ── Verify each repaired wheel installs and imports on its target ABI ─
  verify:
    name: Verify wheel (py${{ matrix.python_version }})
    runs-on: ubuntu-latest
    needs: build-wheel
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-wheel-py${{ matrix.python_version }}
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - uses: astral-sh/setup-uv@v4

      - name: Install from wheel and import
        run: |
          uv pip install --system dist/*.whl
          python -c "import xtrace_sdk; print('Imported:', xtrace_sdk.__name__)"

  # ── Publish to TestPyPI on staging branch pushes ──────────────────────
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [verify, build-sdist]
    if: github.ref == 'refs/heads/staging'
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Publish (TestPyPI via OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          packages-dir: dist
          skip-existing: true

  # ── Publish to PyPI on tag pushes (v*) ────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [verify, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Publish (PyPI via OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          packages-dir: dist
          skip-existing: true
